<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Symphony of Words{% endblock %}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap');

        :root {
            /* MAIN PURPLE PALETTE */
            --deep-royal: #2A1238;
            --main-ui-purple: #4B1F63;
            --vibrant-purple: #6F2C91;
            --soft-glow-purple: #9A52C7;
            --magical-lavender: #C58AF9;
            --dark-bg-purple: #140B1F;

            /* MAIN GOLD PALETTE */
            --bright-gold: #F6D86B;
            --warm-gold: #E8B84D;
            --antique-gold: #C98A2B;
            --dark-gold: #8B5A1E;
            --soft-cream: #FFF1B8;
            --amber-glow: #FFCC55;

            /* BACKGROUNDS */
            --main-bg: #0D0814;
            --secondary-bg: #161021;
            --card-bg: #22152F;
            --hover-bg: #311D45;
            --input-bg: #2B203A;

            /* ACCENTS */
            --pink-purple: #D66BFF;
            --neon-violet: #B84DFF;
            --star-shine: #FFF9E8;

            /* SHADOWS & GLOWS */
            --gold-glow: rgba(246, 216, 107, 0.35);
            --text-glow: rgba(255, 204, 85, 0.55);
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--main-bg);
            color: #F3EFFF;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 10;
        }

        .bg-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            z-index: -1;
            opacity: 0.6;
        }

        h1, h2, h3 {
            color: var(--bright-gold);
            text-shadow: 0 0 10px var(--text-glow);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 5;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--dark-gold);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(111, 44, 145, 0.2);
            backdrop-filter: blur(15px);
        }

        /* PREMIUM BUTTONS */
        .btn-custom {
            display: inline-block;
            border: 2px solid var(--bright-gold);
            border-radius: 12px;
            background-color: var(--main-ui-purple);
            color: var(--star-shine);
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .btn-image {
            display: inline-block;
            border: none;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            background-color: transparent;
        }

        .btn-custom:hover, .btn-image:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 20px var(--gold-glow));
            border-color: var(--soft-cream);
        }

        .btn-custom:active, .btn-image:active {
            transform: scale(0.95);
        }

        .word-tag {
            background: linear-gradient(135deg, var(--deep-royal), var(--main-ui-purple));
            border: 1px solid var(--antique-gold);
            color: var(--soft-cream);
            padding: 10px 22px;
            border-radius: 30px;
            cursor: pointer;
            margin: 8px;
            display: inline-block;
            transition: 0.3s all;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .word-tag:hover {
            background: var(--vibrant-purple);
            color: var(--bright-gold);
            border-color: var(--bright-gold);
            box-shadow: 0 0 20px var(--gold-glow);
            transform: translateY(-3px) scale(1.1);
        }

        input[type="text"] {
            background: var(--input-bg);
            border: 2px solid var(--dark-gold);
            color: var(--star-shine);
            padding: 18px 30px;
            border-radius: 15px;
            width: 100%;
            font-size: 1.1em;
            margin-bottom: 25px;
            outline: none;
            transition: 0.3s;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }

        input[type="text"]:focus {
            border-color: var(--bright-gold);
            box-shadow: 0 0 20px rgba(246, 216, 107, 0.25), inset 0 2px 10px rgba(0,0,0,0.5);
        }

        .output p {
            font-size: 1.4em;
            line-height: 1.6;
            margin: 10px 0;
            color: #FFF;
            font-style: italic;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        @keyframes slideInLeft {
            from { transform: translateX(-100vw); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100vw); opacity: 0; }
        }

        .animate-enter {
            animation: slideInLeft 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        .animate-exit {
            animation: slideOutRight 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }
    </style>
</head>
<body>
    <div class="vignette"></div>
    <div class="bg-layer" style="background-image: url('{{ url_for('static', filename='customs/bg_selection.png') }}')">
    </div>
    {% block content %}{% endblock %}

    <script>
        function transitionTo(url, element) {
            element.classList.add('animate-exit');
            setTimeout(() => {
                window.location.href = url;
            }, 700);
        }
    </script>
</body>
</html>
