{% extends "base.html" %}

{% block title %}Selection | Symphony of Words{% endblock %}

{% block bg_url %}/static/customs/bg_selection.png{% endblock %}

{% block content %}
<div class="container"
    style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
    <h1 class="animate-enter" style="font-size: 3em; margin-bottom: 50px;">Choose Your Muse</h1>

    <div style="display: flex; flex-direction: column; gap: 20px; align-items: center;">
        
        <div class="btn-image animate-enter"
            style="width: 400px; height: 180px; background-image: url('/static/customs/MARKOV BUTTON.png'); animation-delay: 0.2s;"
            onclick="transitionTo('/markov', this)">
        </div>

      
        <div class="btn-image animate-enter"
            style="width: 400px; height: 180px; background-image: url('/static/customs/CRPO.png'); animation-delay: 0.4s;"
            onclick="transitionTo('/crpo', this)">
        </div>
    </div>

    <p class="animate-enter" style="margin-top: 40px; color: var(--muted-text); animation-delay: 0.6s;">
        Markov: Coherent Trigram Sequences | CRPO: Semantic Semantic Optimization
    </p>
</div>
{% endblock %}
